version: '3.8'

services:
  # ========== FRONTEND ==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api-gateway
    networks:
      - skillflow-network

  # ========== API GATEWAY ==========
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://skillflow:password@postgres:5432/skillflow
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BROKERS=kafka:9092
      - USER_SERVICE_URL=http://user-service:8001
      - SKILL_PARSER_URL=http://skill-parser:8002
      - GAP_ANALYZER_URL=http://gap-analyzer:8003
      - RECOMMENDATION_URL=http://recommendation:8004
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
    volumes:
      - ./api-gateway:/app
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - skillflow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========== MICROSERVICES ==========
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    environment:
      - SERVICE_NAME=user-service
      - PORT=8001
      - DATABASE_URL=postgresql://skillflow:password@postgres:5432/skillflow
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
    volumes:
      - ./services/user-service:/app
    depends_on:
      - postgres
      - redis
    networks:
      - skillflow-network

  skill-parser:
    build:
      context: ./services/skill-parser
      dockerfile: Dockerfile
    environment:
      - SERVICE_NAME=skill-parser
      - PORT=8002
      - DATABASE_URL=postgresql://skillflow:password@postgres:5432/skillflow
      - FEATURE_STORE_URL=http://feature-store:8501
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=resume-events
    volumes:
      - ./services/skill-parser:/app
      - ./data/resumes:/data/resumes
    depends_on:
      - postgres
      - feature-store
      - kafka
    networks:
      - skillflow-network

  gap-analyzer:
    build:
      context: ./services/gap-analyzer
      dockerfile: Dockerfile
    environment:
      - SERVICE_NAME=gap-analyzer
      - PORT=8003
      - DATABASE_URL=postgresql://skillflow:password@postgres:5432/skillflow
      - FEATURE_STORE_URL=http://feature-store:8501
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - USER_SERVICE_URL=http://user-service:8001
      - SKILL_PARSER_URL=http://skill-parser:8002
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_CONSUME_TOPIC=resume-events
      - KAFKA_PRODUCE_TOPIC=analysis-events
      - ML_MODEL_PATH=/app/models/sentence-transformer
    volumes:
      - ./services/gap-analyzer:/app
      - ./models:/app/models
    depends_on:
      - postgres
      - feature-store
      - elasticsearch
      - kafka
    networks:
      - skillflow-network

  recommendation:
    build:
      context: ./services/recommendation
      dockerfile: Dockerfile
    environment:
      - SERVICE_NAME=recommendation
      - PORT=8004
      - DATABASE_URL=postgresql://skillflow:password@postgres:5432/skillflow
      - FEATURE_STORE_URL=http://feature-store:8501
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=analysis-events
    volumes:
      - ./services/recommendation:/app
    depends_on:
      - postgres
      - feature-store
      - elasticsearch
      - kafka
    networks:
      - skillflow-network

  vacancy-scraper:
    build:
      context: ./services/vacancy-scraper
      dockerfile: Dockerfile
    environment:
      - SERVICE_NAME=vacancy-scraper
      - PORT=8005
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - FEATURE_STORE_URL=http://feature-store:8501
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SCRAPING_INTERVAL_HOURS=24
    volumes:
      - ./services/vacancy-scraper:/app
    depends_on:
      - elasticsearch
      - feature-store
      - redis
    networks:
      - skillflow-network
    command: >
      sh -c "python worker.py"

  celery-worker:
    build:
      context: ./services/vacancy-scraper
      dockerfile: Dockerfile
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - ./services/vacancy-scraper:/app
    depends_on:
      - redis
      - vacancy-scraper
    networks:
      - skillflow-network
    command: >
      sh -c "celery -A tasks worker --loglevel=info"

  # ========== DATA STORES ==========
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=skillflow
      - POSTGRES_USER=skillflow
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - skillflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - skillflow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - skillflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ========== FEATURE STORE ==========
  feature-store:
    image: feastdev/feature-server:0.31.1
    ports:
      - "8501:8501"
    environment:
      - FEAST_REPO_CONFIG=file:/feature_repo/feature_store.yaml
    volumes:
      - ./feature_repo:/feature_repo
    networks:
      - skillflow-network
    depends_on:
      - redis
      - postgres

  # ========== ASYNC PROCESSING ==========
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - skillflow-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - skillflow-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--list", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
    depends_on:
      - kafka
      - zookeeper
    networks:
      - skillflow-network

  # ========== MONITORING & OBSERVABILITY ==========
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - skillflow-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - skillflow-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"  # UI
      - "14268:14268"  # Collector
      - "6831:6831/udp" # Agent
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - skillflow-network

networks:
  skillflow-network:
    driver: bridge

volumes:
  postgres-data:
  elasticsearch-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data: